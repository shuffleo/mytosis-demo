name: Preview mytosis

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: mytosis-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build pull request
        run: npm run build

      - name: Upload static build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mytosis-pr-${{ github.event.pull_request.number }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  preview:
    needs: build
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted base configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install trusted deployment tooling
        run: npm ci

      - name: Download pull request build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mytosis-pr-${{ github.event.pull_request.number }}
          path: dist

      - name: Validate Worker package
        run: npm run deploy:dry-run

      - name: Check deployment credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Preview skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          fi

      - id: deploy
        name: Create or update Worker Preview
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview \
            --worker-name mytosis \
            --name "pr-${{ github.event.pull_request.number }}" \
            --tag "${{ github.sha }}" \
            --message "PR #${{ github.event.pull_request.number }}" \
            --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe Preview root and SPA fallback
        if: steps.deploy.outputs.preview_url != ''
        run: |
          curl --fail --show-error --silent --location \
            --header "Sec-Fetch-Mode: navigate" \
            "$PREVIEW_URL/" > /dev/null
          curl --fail --show-error --silent --location \
            --header "Sec-Fetch-Mode: navigate" \
            "$PREVIEW_URL/journal/preview-check" > /dev/null
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}

      - name: Comment Preview URL
        if: steps.deploy.outputs.preview_url != ''
        run: >-
          gh pr comment "${{ github.event.pull_request.number }}"
          --edit-last --create-if-none
          --body "Cloudflare Worker Preview: ${{ steps.deploy.outputs.preview_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base configuration
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install trusted deployment tooling
        run: npm ci

      - name: Check deployment credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete closed pull request Preview
        if: steps.credentials.outputs.configured == 'true'
        run: >-
          npx wrangler preview delete
          --worker-name mytosis
          --name "pr-${{ github.event.pull_request.number }}"
          --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
